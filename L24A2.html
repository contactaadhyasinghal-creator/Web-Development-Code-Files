<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods In Array</title>
</head>
<body>
    <h1>Methods In Array</h1>
    <p id = "cars"></p>
    <p id = "car-Brands"></p>
    <script>
        var arr = ["Mercedes", "BMW", "Audi", "Toyota", "Honda"];
        document.getElementById("cars").innerHTML = arr.join("|");
        document.getElementById("car-Brands").innerHTML = arr.pop()
    </script>
</body>
</html>
