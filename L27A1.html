<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Playlist Sorter</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body { background: lavender;}
        h1, h3 { color: darkviolet; }
        .box { background: white; color: darkviolet; }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">Sort your favorite songs with ease using JavaScript!</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A-Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z-A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Play Counts</h3>
                <button class="btn btn-primary mr-2" onclick="sortLeast()">Sort Least Played First</button>
                <button class="btn btn-primary" onclick="sortMost()">Sort Most Played First</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Play Count</h3>
                <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                <div id="labelResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

    </div>
    <script>
        var songs = ["Zoom", "Sunflower", "Blinding Lights", "Levitating", "Watermelon Sugar"];
        var playCounts = [320, 85, 210, 50, 175];

        document.getElementById("nameResult").innerHTML ="Songs: " + songs;
        document.getElementById("countResult").innerHTML ="Play Counts: " + playCounts;
        document.getElementById("labelResult").innerHTML ="Press the button above!";

        function sortAZ() {songs.sort();
    document.getElementById("nameResult").innerHTML = "A-Z Sorted Songs: " + songs;}
        function sortZA() {songs.sort(); songs.reverse();
    document.getElementById("nameResult").innerHTML = "Z-A Sorted Songs: " + songs;}  
        function sortLeast() { playCounts.sort(function(a,b){return a-b;});
    document.getElementById("countResult").innerHTML = "Least Played First: " + playCounts;}
        function sortMost() { playCounts.sort(function(a,b){return b-a;});
    document.getElementById("countResult").innerHTML = "Most Played First: " + playCounts;}
        function addLabel() {var l = playCounts.map(function(c){return c+" plays";}); document.getElementById("labelResult").innerHTML = "labelled: " + l; }   
    </script>
</body>
</html>
