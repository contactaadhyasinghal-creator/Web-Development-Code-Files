<!DOCTYPE>
<html>
    <head>
        <title>JavaScript Functions</title>
    </head>
    <body>
        <h1>JavaScript Functions</h1>
        <button onclick = 'display (4, 5)'>Click Me</button>

        <script>
            function display( x, y ) {
                if ( y == undefined) {
                    y = 10;
                }
                document.write( x*y );
            }
        </script>
    </body>
</html>
