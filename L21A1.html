<!DOCTYPE html>
<html>
    <head>
        <title>
            Javascript String Methods
        </title>
    </head>

    <body>
        <h2>Javascript String Methods</h2>
        <p>Basic Methods</p>

        <script>
            var str = "AmAzInG";
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith("i"));
            document.write("<br>");

            var str1 = "I learnt about Javascript String Methods";
            patt = new RegExp("about");
            res = patt.test(str1);
            document.write(res);
        </script>
    </body>
</html>
