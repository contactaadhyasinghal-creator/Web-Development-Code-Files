<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: aliceblue;
            padding: 30px;
        }
        h1 {
            color: navy;
        }
        input {
            margin: 5px;
            padding: 8px;
            border: 2px solid navy;
            border-radius: 6px;
            width: 220px;
        }
        button {
            background-color: navy;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: pink;
            color: navy;
            border: 2px solid navy;
        }

        #timer {
            color: grey;
        }
    </style>
</head>
<body>
    <h1>Lucky Draw</h1>
    <p>Welcome to the Lucky Draw! Enter your name and guess the winning number!</p>
    <input type="text" id="name" placeholder="Your name" required><br>
    <p id="msg-name"></p>

    <input type="number" id="guess" placeholder="Guess a number (1 to 5)" min="1" max="5" required><br>
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try My Luck!</button>
    <p id="result"></p>
    <p id="timer"></p>

    <script>
        var seconds = 0;
        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "You have been here for " + seconds + " seconds!";
        }, 1000);

        function checkForm() {
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if ( name == "") {
                document.getElementById("msg-name").textContent = "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok= false;
            } else {
                document.getElementById("msg-name").textContent = "Great name!";
            document.getElementById("msg-name").style.color = "green";
            }
            if ( guess == "") {
                document.getElementById("msg-guess").textContent = "Please enter your guess!";
                document.getElementById("msg-guess").style.color = "red";
                ok= false;
            } else {
                document.getElementById("msg-guess").textContent = "Good guess!";
                document.getElementById("msg-guess").style.color = "green";
            }
            if (ok == true) {
                var lucky = Math.floor(Math.random() * 5) + 1;
                if (guess == lucky) {
                    document.getElementById("result").textContent = "Congratulations " + name + "! You guessed the lucky number " + lucky + "!";
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").textContent = "Sorry " + name + ", the lucky number was " + lucky + ". Better luck next time!";
                    document.getElementById("result").style.color = "navy";
                }
            }
        }
    </script>
</body>
</html>
