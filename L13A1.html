<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<style>
    body{
        background-color: #f9f9f9;
        font-family: Arial, sans-serif;
        padding:30px 15px;
    }
    h1 {
        text-align: center;
        color: #ff5a43;
    }

    .hobby-card {
        text-align: center;
        border: 2px solid #ff5a43;
        border-radius : 8px;
        padding: 20px;
        margin-bottom: 20px;
        background-color: #fff8e1;
    }

    .hobby-card h3 {
        color: #ff5a43
    }
</style>

</head>
<body>
    <h1>My Hobby Cards</h1>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love Sketching animals and comic characters!</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Hula Hoop</h3>
                    <p>I love hula hooping it gives me joy!</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Dance</h3>
                    <p>I love Dancing on high beats!</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
</body>
</html>
