<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(253, 196, 255);">
    <h1> My Doctor's Appointment </h1>
    <p> Fill this form to get your appointment. </p>
    <hr>
    <form>
        <fieldset> 
            <legend> Personal Details </legend>
            <label> Your name: </label><br> 
            <input type="text" id="uname"><br><br> 
             <label> Patient Id: </label><br> 
            <input type="number" id="uname"><br><br> 
             <label> Date of Birth: </label><br> 
            <input type="date" id="dob"><br><br> 
        </fieldset>
        <fieldset>
              <legend> Your Visit </legend>
            <label> Choose your doctor: </label><br>
            <select id="doctor">
                <option value=""> Select A doctor </option>
                <option value="dr-ray"> Dr. Ray General</option>
                 <option value="dr-lee"> Dr. Lee Teeth</option>
                  <option value="dr-sam"> Dr. Sam Eyes</option>
                </select><br><br>
                <label> Why are you visiting? : </label> <br>
                <input type="radio" name=" vis">Fever <br>
                <input type="radio" name=" vis">Cold <br>
                <input type="radio" name=" vis">Checkup <br>
                <input type="radio" name=" vis">Toothpain <br><br>
                <label> Any notes for the doctor? : </label> 
                <textarea id="notes" rows="3" cols="30"></textarea>         
        </fieldset>
        <fieldset>
            <legend> Preffered Visit Day</legend>

            <input type="checkbox" value="mon"> Monday<br>
            <input type="checkbox" value="wed"> Wednesday<br>
            <input type="checkbox" value="fri"> Friday<br>
        </fieldset>

        <br>
        <input type="submit" value="Book My Appointment"
    </form>
</body>
</html>
